<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baker Calc">
<title>Baker Calculator</title>
<style>html,body{margin:0;min-height:100%;background:#f7f2ea;color:#211b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.mark{font-family:Georgia,serif;font-size:34px;font-weight:700}.sub{margin-top:10px;color:#726960}.dot{display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style>
</head>
<body>
<div class="loading"><div><div class="mark">Baker Calculator</div><div class="sub">Loading test build <span class="dot">•••</span></div></div></div>
<script>
(async()=>{
 try{
  const r=await fetch('parts/01.txt?v=015fix2',{cache:'no-store'});
  if(!r.ok) throw new Error('App package '+r.status);
  const encoded=(await r.text()).replace(/\s+/g,'');
  const raw=atob(encoded);
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('Please use a current version of Safari or Chrome.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
 }catch(e){
  document.body.innerHTML='<div class="loading"><div><div class="mark">Baker Calculator</div><div class="sub">Could not load the prototype.<br><br>'+String(e.message||e)+'</div></div></div>';
 }
})();
</script>
</body>
</html>
